$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.0, 0.5, 0.5, 1.0
    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.config/hypr/back.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.18
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.32
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(88C0D0ee) rgba(5E81ACee) 45deg
    inner_color = rgba(2E3440cc)
    font_color = rgb(ECEFF4)
    fade_on_empty = true
    placeholder_text = <i>Пароль...</i>
    hide_input = false
    rounding = 18
    check_color = rgba(A3BE8Cee) rgba(EBCB8Bee) 45deg
    fail_color = rgba(BF616Aee) rgba(D08770ee) 45deg
    fail_text = <i>$FAIL</i>
    fail_transition = 250
    font_family = $font

    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ECEFF4ee)
    font_size = 88
    font_family = $font
    
    position = 0, 82
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(D8DEE9cc)
    font_size = 22
    font_family = $font

    position = 0, 24
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[us,ru]
    color = rgba(88C0D0dd)
    font_size = 18
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 0, -142
    halign = center
    valign = center
}
