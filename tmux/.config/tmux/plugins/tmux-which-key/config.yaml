command_alias_start_index: 260
keybindings:
  prefix_table: Space

title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=#88c0d0,align=centre,bold

position:
  x: R
  y: P

custom_variables: []

macros:
  - name: sessionx
    commands:
      - send-prefix
      - send-keys o
  - name: extrakto
    commands:
      - send-prefix
      - send-keys x
  - name: thumbs
    commands:
      - run-shell -b ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh
  - name: jump
    commands:
      - send-prefix
      - send-keys j
  - name: neolazygit
    commands:
      - send-prefix
      - send-keys N
  - name: popup-shell
    commands:
      - send-prefix
      - send-keys p
  - name: popup-lazygit
    commands:
      - send-prefix
      - send-keys G
  - name: popup-yazi
    commands:
      - send-prefix
      - send-keys e
  - name: popup-agent
    commands:
      - send-prefix
      - send-keys a
  - name: copycat-files
    commands:
      - send-prefix
      - send-keys C-f
  - name: copycat-urls
    commands:
      - send-prefix
      - send-keys C-u
  - name: workspace-layout
    commands:
      - send-prefix
      - send-keys m
  - name: edit-window
    commands:
      - send-prefix
      - send-keys E
  - name: agent-window
    commands:
      - send-prefix
      - send-keys A
  - name: run-window
    commands:
      - send-prefix
      - send-keys U
  - name: recent-files
    commands:
      - send-prefix
      - send-keys f
  - name: all-files
    commands:
      - send-prefix
      - send-keys F
  - name: ripgrep-search
    commands:
      - send-prefix
      - send-keys /
  - name: review-changes
    commands:
      - send-prefix
      - send-keys V
  - name: diff-changes
    commands:
      - send-prefix
      - send-keys D
  - name: copy-pane-context
    commands:
      - send-prefix
      - send-keys Y
  - name: sync-panes
    commands:
      - send-prefix
      - send-keys S
  - name: tea-menu
    commands:
      - send-prefix
      - send-keys t

items:
  - name: +Session
    key: s
    menu:
      - name: SessionX
        key: o
        macro: sessionx
      - name: Last window
        key: Tab
        command: last-window
      - name: Previous window
        key: h
        command: previous-window
      - name: Next window
        key: l
        command: next-window
      - name: Rename window
        key: r
        command: command-prompt -I "#W" "rename-window -- \"%%%\""

  - name: +Agent
    key: a
    menu:
      - name: Bootstrap edit/agent/run
        key: m
        macro: workspace-layout
      - name: Edit window
        key: e
        macro: edit-window
      - name: Agent window
        key: a
        macro: agent-window
      - name: Agent popup
        key: p
        macro: popup-agent
      - name: Run window
        key: r
        macro: run-window
      - name: Review changed files
        key: v
        macro: review-changes
      - name: Diff changed files
        key: d
        macro: diff-changes
      - name: Copy pane context
        key: y
        macro: copy-pane-context
      - name: Synchronize panes
        key: s
        macro: sync-panes

  - name: +Files
    key: f
    menu:
      - name: Recent and changed files
        key: f
        macro: recent-files
      - name: All project files
        key: a
        macro: all-files
      - name: Changed files
        key: c
        macro: copycat-files
      - name: Ripgrep search
        key: /
        macro: ripgrep-search

  - name: +Pane
    key: p
    menu:
      - name: Left
        key: h
        command: select-pane -L
      - name: Down
        key: j
        command: select-pane -D
      - name: Up
        key: k
        command: select-pane -U
      - name: Right
        key: l
        command: select-pane -R
      - name: Zoom
        key: z
        command: resize-pane -Z
      - name: Break pane
        key: b
        command: break-pane

  - name: +Split
    key: w
    menu:
      - name: Vertical split
        key: '|'
        command: split-window -h -c "#{pane_current_path}"
      - name: Horizontal split
        key: '-'
        command: split-window -v -c "#{pane_current_path}"
      - name: New window
        key: c
        command: new-window -c "#{pane_current_path}"
      - name: Kill pane
        key: x
        command: kill-pane

  - name: +Copy
    key: c
    menu:
      - name: Copy mode
        key: c
        command: copy-mode
      - name: Thumbs hints
        key: ';'
        macro: thumbs
      - name: Extrakto fuzzy copy
        key: x
        macro: extrakto
      - name: Jump to visible text
        key: j
        macro: jump
      - name: Copycat file search
        key: f
        macro: copycat-files
      - name: Copycat url search
        key: u
        macro: copycat-urls

  - name: +Popup
    key: g
    menu:
      - name: Shell popup
        key: p
        macro: popup-shell
      - name: Lazygit popup
        key: G
        macro: popup-lazygit
      - name: Neolazygit
        key: N
        macro: neolazygit
      - name: Yazi popup
        key: e
        macro: popup-yazi
      - name: Tea timer
        key: t
        macro: tea-menu

  - name: +Resize
    key: r
    menu:
      - name: Wider
        key: l
        command: resize-pane -R 5
      - name: Narrower
        key: h
        command: resize-pane -L 5
      - name: Taller
        key: j
        command: resize-pane -D 5
      - name: Shorter
        key: k
        command: resize-pane -U 5
